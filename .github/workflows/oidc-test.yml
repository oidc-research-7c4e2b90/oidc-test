name: OIDC fork-PR research test

on:
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      VARS_TEST: ${{ vars.VARS_TEST }}
      CANARY: ${{ secrets.CANARY }}
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Dump OIDC token claims
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/probe.py
          python3 /tmp/probe.py

      - name: Check variable interpolation
        shell: bash
        run: |
          echo "VARS_TEST length: ${#VARS_TEST}"
          if [ -n "$VARS_TEST" ]; then echo "VARS_TEST IS interpolated on this run"; else echo "VARS_TEST is EMPTY (withheld for this run type)"; fi

      - name: Check secret injection (canary)
        shell: bash
        run: |
          echo "CANARY length: ${#CANARY}"
          if [ -n "$CANARY" ]; then echo "CANARY IS injected on this run"; else echo "CANARY is EMPTY (withheld for this run type)"; fi

      - name: Report run context
        shell: bash
        run: |
          echo "event: ${GITHUB_EVENT_NAME}"
          echo "repo: ${GITHUB_REPOSITORY}"
          echo "ref:  ${GITHUB_REF}"
          echo "sha:  ${GITHUB_SHA}"
